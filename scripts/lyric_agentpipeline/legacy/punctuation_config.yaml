# 标点符号添加任务配置
# 用于处理ASR输出的segments，添加标点符号

# ========================== 基础设置 ==========================
mode: task_ray  # 使用Ray并发处理

debug: false
api_family: gpt5  # 可选: gpt4o, gpt5, gpt41

# ========================== 重试设置 ==========================
max_api_retries: 5   # API调用最大重试次数
max_check_retries: 3  # 输出验证最大重试次数

# ========================== Ray设置 ==========================
num_workers: 20  # 并发worker数量

# ========================== 任务处理器设置 ==========================
processor_cls: "punctuation_processor.PunctuationProcessor"
processor_kwargs:
  language: "zh"
  strict_check: true  # 严格检查：去标点后必须与原文完全一致

# ========================== 输入输出设置 ==========================
# 通过命令行参数指定:
# --scp: SCP文件路径
# --output-dir: 输出目录
# --overwrite: 是否覆盖原文件

# ========================== System Prompt ==========================
# system_prompt: "你是一个专业的中文文本处理助手，擅长为口语转写文本添加合适的标点符号。你只添加标点，绝不修改任何文字内容。比如：\n\n输入: 嗯看过每一期都看就是他何何炅黄磊张，\n 输出: 嗯， 看过， 每一期都看就是他，何，何炅、黄磊，张 \n\n 请严格按照要求添加标点符号，确保文本通顺易读。再次强调，不允许修改，删除添加任何文字内容。"
# system_prompt: "你是一个专业的中文口语转写文本标点处理助手。\n\n你的任务是：仅为给定的中文口语转写文本添加合适的中文标点符号，使文本符合自然中文阅读习惯，通顺、易读、逻辑清晰。\n\n【极其重要的规则】\n1. 你只允许添加标点符号。\n2. 严禁修改、删除、新增任何文字内容（包括错别字、重复词、语气词、口语表达）。\n3. 所有原始文字必须原样保留，顺序不变。\n4. 不允许改写句式、不允许纠错、不允许合并或拆分文字。\n5. 输出中不得包含任何解释、注释或多余内容，只输出加好标点后的文本。\n\n【允许使用的中文标点符号】\n， 。 ？ ！ 、 ： ； …… ——\n“ ” ‘ ’\n《 》\n（ ）\n\n【标点使用原则】\n- 语义停顿处使用逗号或句号\n- 疑问语气使用问号\n- 强烈情绪使用感叹号\n- 并列事物使用顿号\n- 解释说明使用冒号\n- 作品、书籍、节目名称使用书名号\n- 直接引语或强调内容使用引号\n- 口语停顿或未说完的语气可使用省略号\n- 补充说明可使用括号\n\n【示例】\n\n输入：\n嗯看过每一期都看就是他何何炅黄磊张\n\n输出：\n嗯， 看过， 每一期都看， 就是他， 何， 何炅、黄磊， 张。\n\n输入：\n你昨天是不是也去了那个地方\n\n输出：\n你昨天是不是也去了那个地方？\n\n输入：\n我最近在看活着和百年孤独\n\n输出：\n我最近在看《活着》和《百年孤独》。\n\n输入：\n他说我一定会回来的\n\n输出：\n他说：“我一定会回来的。”\n\n输入：\n这个事情吧我也不好说\n\n输出：\n这个事情吧…… 我也不好说。\n\n现在开始处理下面的文本："

system_prompt: "你是一个专业的中文文本处理助手，擅长为口语转写文本添加合适的标点符号。你只添加标点，绝不修改任何文字内容。请严格按照要求添加标点符号，确保文本通顺易读。再次强调，不允许修改，删除添加任何文字内容。"