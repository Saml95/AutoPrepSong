
# Note: input_jsonl and output_base_dir are now provided via command line arguments
# Example usage:
#   python scripts/autoprep_song_jwyu.py -c config/amlt_basic.yaml -i example/test.jsonl -o exp/example_jwyu_jsonl
#   python scripts/autoprep_song_jwyu.py -c config/amlt_basic.yaml -i example/test.jsonl -o exp/example_jwyu_jsonl -s 0 -n 100

# blob ckpt dir
ckpts_base_dir: /mnt/conversationhubhot/jianweiyu/AutoPrepSongV2/

intermediate_scp_dir: ${output_base_dir}/intermediate
output_dir: ${output_base_dir}/final_output

songformer_init_args:
  model: SongFormer
  config_path: SongFormer.yaml
  output_dir: ${intermediate_scp_dir}/songformer_output
  CHECKPOINT_PATH: ${ckpts_base_dir}/ckpts/SongFormer.safetensors
  MUSICFM_HOME_PATH: ${ckpts_base_dir}/ckpts/MusicFM
  MUQ_PATH: ${ckpts_base_dir}/ckpts/MuQ-large-msd-iter

separator_init_args:
  model_type: bs_roformer
  config_path: thirdparty/music_Source_Separation_Training/configs/viperx/model_bs_roformer_ep_317_sdr_12.9755.yaml
  # start_check_point: thirdparty/music_Source_Separation_Training/ckpts/model_bs_roformer_ep_317_sdr_12.9755.ckpt
  start_check_point: ${ckpts_base_dir}/ckpts/model_bs_roformer_ep_317_sdr_12.9755.ckpt
  extract_instrumental: true
  store_dir: ${intermediate_scp_dir}/separation_output

vad_init_args:
  output_dir: ${intermediate_scp_dir}/vad_output



# TASK
resume: true
do_songformer: true
do_separation: true
do_vad: true
